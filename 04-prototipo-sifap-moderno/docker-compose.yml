services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sifap
      POSTGRES_USER: sifap
      POSTGRES_PASSWORD: sifap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifap -d sifap"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sifap
      SPRING_DATASOURCE_USERNAME: sifap
      SPRING_DATASOURCE_PASSWORD: sifap
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
